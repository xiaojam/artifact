services:
  # Your app: built into a .deb at image-build time, then run from the installed package.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Drop directory shared with sftpgo (the "orders" user's home).
      ORDER_IMPORT_DIR: /data/orders
      LOG_FILE: /var/log/app.log
    ports:
      - "8080:8080"          # HTTP API + Swagger UI (http://localhost:8080/docs)
    volumes:
      - orders-data:/data    # shared drop directory (written by sftpgo)
    depends_on:
      - sftpgo
    networks:
      - order-network

  # SFTP server: clients upload order files here; they land in the shared volume.
  sftpgo:
    image: drakkan/sftpgo:v2.7
    environment:
      SFTPGO_DEFAULT_ADMIN_USERNAME: admin
      SFTPGO_DEFAULT_ADMIN_PASSWORD: adminpass
      # Provision the "orders" SFTP user on first start.
      SFTPGO_LOADDATA_FROM: /srv/sftpgo/orders-user.json
    ports:
      - "2022:2022"          # SFTP
      - "8081:8080"          # sftpgo web admin (http://localhost:8081)
    volumes:
      - orders-data:/srv/sftpgo/data        # user homes (orders -> /srv/sftpgo/data/orders)
      - sftpgo-config:/var/lib/sftpgo       # sftpgo data provider (persisted)
      - ./sftpgo/orders-user.json:/srv/sftpgo/orders-user.json:ro
    networks:
      - order-network

volumes:
  orders-data:
  sftpgo-config:

networks:
  order-network:
    name: order-network